statistics:
  lag_orientation: CAPEX(t) versus revenue(t+lag)
  lags:
    minimum: 0
    maximum: 8
    values: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  raw_confirmatory_family:
    windows: [full]
    layers: 8
    lags_per_layer: 9
    family_size: 72
    correction: Holm
  split_diagnostics:
    windows: [early, late]
    bootstrap_draws: 0
    correction_family: none
    exact_lag_match_required: true
  detrended_confirmatory_family:
    windows: [full]
    layers: 8
    lags_per_layer: 9
    family_size: 72
    correction: Holm
    break_quarter: 2020Q1
    terms: [intercept, linear_quarter_index, post_level, post_slope]
    exact_raw_supported_lag_required: true
  bootstrap:
    method: circular_stationary
    draws: 99999
    seed: 20260807
    expected_block_length_quarters: 8
    null_paths: independent_x_and_y
    confidence_interval_paths: paired
  minimum_n:
    descriptive: 12
    inferential: 32
  alpha: 0.05
  effective_sample_size_max_lag: 8
  cycles:
    smoothing_quarters: 4
    extrema_radius: 2
    minimum_phase_quarters: 4
    minimum_cycle_quarters: 8
    minimum_for_nonexploratory_classification: 4
    design_period_episodes:
      - 2018-2019 downcycle
      - 2020-2021 pandemic cycle
      - 2024-2026 AI expansion
    note: These three named episodes are a qualitative design warning, not mechanically complete independent cycles.

criteria:
  all_must_pass: true
  minimum_supported_noncontrol_layers: 3
  exact_early_late_peak_match_to_full_supported_lag: true
  exact_lag_detrended_positive_holm_significant: true
  tsmc_control_layer: foundry
  tsmc_control_must_have_no_positive_holm_significant_lag: true
  phase_2_forbidden_unless_all_pass: true

