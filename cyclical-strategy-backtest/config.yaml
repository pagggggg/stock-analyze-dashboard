# =====================================================================
# cyclical-strategy-backtest / config.yaml
# ---------------------------------------------------------------------
# 所有門檻、分類條件、各組參數、日期切割、指標來源都寫在這裡。
# 「改動留紀錄」:任何門檻調整都必須在 CHANGELOG 區塊登記(日期+原因),
#  不得為了讓某組通過而事後調參(見 README 的防過擬合章節)。
#
# 防過擬合硬規定:
#   - 每個「進場組」的可調參數 <= 4,且各組獨立、不共用。
#   - 不做參數搜尋(grid search),不事後最佳化。
#   - 樣本內(in_sample)定義參數,樣本外(out_sample)只驗證、不回頭改。
# =====================================================================

meta:
  project: cyclical-strategy-backtest
  phase: 1                      # 只跑階段一(海運貨櫃三雄);通過後才手動開階段二三
  survivor_bias_note: >
    國巨(2327)為構想來源,存在倖存者偏差 → 不在階段一樣本內。
    階段三才會單獨列示國巨,且不計入有效性判定。

# ---------------------------------------------------------------------
# 日期切割:樣本內定參、樣本外驗證(兩段分別報告,不混算)
# ---------------------------------------------------------------------
periods:
  in_sample:  ["2010-01-01", "2017-12-31"]   # 定義/確認參數用
  out_sample: ["2018-01-01", "2026-07-31"]   # 只驗證,不得回頭改參數
  full:       ["2010-01-01", "2026-07-31"]

# ---------------------------------------------------------------------
# 領先指標(運價指數)資料源
#   決策(經使用者確認):貨櫃運價指數(container)為主 + BDI 交叉檢核。
#   貨櫃指數免費歷史只到 2025-03-30 → 樣本外 2025-04~2026-07 明確標示
#   「無貨櫃指數覆蓋」,該段改以 BDI + 財報訊號檢核,不硬湊。
# ---------------------------------------------------------------------
freight:
  source: investing_api        # api.investing.com/api/financialdata/historical
  container:                   # 主指標(貨櫃)
    pair_id: 940796
    label: "Container Freight Index (investing.com #940796)"
    # 註:investing.com metadata 被 Cloudflare 擋,SCFI vs CCFI 精確標籤無法確認;
    #     已驗證屬「貨櫃運價」類(非乾散貨),值域 243~3584,週更,2009→2025-03。
    coverage_end: "2025-03-30"
  container_alt:               # 貨櫃第二來源(交叉檢核)
    pair_id: 940798
    label: "Container Freight Index alt (investing.com #940798)"
    coverage_end: "2025-03-30"
  bdi:                         # 交叉檢核 + 貨櫃缺口期替補檢核(乾散貨,非主訊號)
    pair_id: 940793
    label: "Baltic Dry Index (BADI, investing.com #940793)"
    coverage_end: "2026-07-31"
  primary: container           # 主訊號用哪個:container / bdi

# ---------------------------------------------------------------------
# 標的與對照組
# ---------------------------------------------------------------------
universe:
  phase1_targets:              # 海運貨櫃三雄(受測循環股)
    - {id: "2603", name: "長榮"}
    - {id: "2609", name: "陽明"}
    - {id: "2615", name: "萬海"}
  controls:
    benchmark:  {id: "0050", name: "元大台灣50"}   # 績效基準(真實替代選項)
    overfit:    {id: "2330", name: "台積電"}        # 非循環股;若訊號在它身上也有效→抓到的是大盤beta
  # 隨機基準與買進持有在程式內以同期資料生成

# ---------------------------------------------------------------------
# 循環股量化定義(三取二標記);輸出各項數值供人工複核
# ---------------------------------------------------------------------
cyclical_definition:
  lookback_years: 10
  criteria:
    gross_margin_std_pp:   {op: ">", value: 5.0}    # 近10年季毛利率標準差 > 5 個百分點
    eps_yoy_drop_pct:      {op: ">", value: 50.0}   # 曾單季 EPS 年減 > 50%
    revenue_yoy_range_pp:  {op: ">", value: 60.0}   # 營收 YoY 振幅(max-min)> 60 個百分點
  need_hits: 2                                       # 三取二

# ---------------------------------------------------------------------
# 進場規則(兩種哲學分別測;各組參數 <= 4、獨立)
# ---------------------------------------------------------------------
entry:
  # 左側(供給面):運價跌深 + 便宜。分 4 批,每季一批。
  left_supply:
    params:
      freight_percentile_below: 20    # 運價指數 <= 歷史 P20
      pb_percentile_below:      10     # P/B <= 近10年 P10(接近)
      batches:                  4      # 分 4 批
      batch_gap_quarters:       1      # 每季一批(相隔 ~1 季)
  # 右側(需求面):運價回升 + 毛利率轉升 + 營收YoY轉正。分 3 批。
  right_demand:
    params:
      freight_rising_weeks:     4      # 運價指數「連續 4 週」回升
      margin_up_quarters:       2      # 毛利率連 2 季由降轉升
      revenue_yoy_positive:     true   # 營收 YoY 轉正(>0)
      batches:                  3      # 分 3 批
  # 【階段一補充測試】月營收版右側:用「月營收(次月10日公布)」取代季報,驗證時效。
  #   三檔月營收「加總」YoY 由負轉正且連續 2 個月維持 + 運價方向確認。
  #   參數恰 4 個(與季報版同樣把出場參數獨立列在 exit_monthly,計數口徑一致)。
  monthly_revenue:
    params:
      yoy_positive_months:      2      # 加總月營收 YoY 連續 2 個月 > 0(「由負轉正」由上升緣保證)
      freight_direction_weeks:  4      # 運價方向確認:指數 > 4 週前(動能為正)
      batches:                  3      # 分 3 批進場
      batch_gap_weeks:          4      # 每月一批(月訊號 → 月節奏部署)

# ---------------------------------------------------------------------
# 月營收版出場(補充測試專用;與季報版出場獨立不共用)
# ---------------------------------------------------------------------
exit_monthly:
  normal_exit:
    yoy_negative_months: 2             # 加總月營收 YoY 連續 2 個月轉負 → 分 3 批出
    batches: 3
  wrong_exit:
    within_months: 3                   # 進場後 3 個月內月營收 YoY 再度轉負 → 全出
  # 註:需求文件只定義上述兩種出場 → 月營收版「不設時間停損」,不額外加參數。


# ---------------------------------------------------------------------
# 出場規則(全部都測)
# ---------------------------------------------------------------------
exit:
  wrong_exit:                          # 錯誤出場:進場後毛利率再連2季轉降 → 全出
    margin_down_quarters: 2
  time_stop:                           # 時間停損(未進入獲利擴張)
    left_quarters:  12                 # 左側 12 季
    right_quarters: 6                  # 右側 6 季
  profit_exit:                         # 獲利出場:運價由升轉降 + 毛利率連2季轉降 → 分3批出
    freight_turn_down: true
    margin_down_quarters: 2
    batches: 3
  hold_forever: true                   # 對照:持有不賣(進場後持有到期末)

# ---------------------------------------------------------------------
# 交易與指標假設
# ---------------------------------------------------------------------
assumptions:
  fee_bps: 4.25          # 單邊手續費約 0.1425% → 但回測用簡化;見下(round-trip 成本)
  tax_bps: 30.0          # 賣出證交稅 0.3%
  slippage_bps: 0.0
  false_signal_horizon_quarters: 2   # 「假訊號」定義:進場後 N 季內未出現獲利擴張(毛利率連2季升)即記為假訊號
  min_signals_per_group: 5           # 每組訊號 < 5 → 明說樣本不足、不下結論
  random_baseline_runs: 500          # 隨機日進場的抽樣次數
  random_seed: 20260802

# ---------------------------------------------------------------------
# 成功標準(四項全過才算可行;任一不過即宣告不可行,不得調參補救)
# ---------------------------------------------------------------------
success_criteria:
  false_signal_ratio_max: 0.40       # 1) 假訊號比率 < 40%
  out_sample_not_collapse: true      # 2) 樣本外(2018-2026)表現不崩(年化 > 0 且 MDD 不劣於買進持有太多)
  beat_0050_annualized: true         # 3) 年化勝過同期 0050,且最大回撤可接受
  min_signals_per_group: 5           # 4) 每組訊號 >= 5,否則樣本不足
  group_infeasible_false_signal: 0.50 # 某組假訊號比率 > 50% → 直接宣告該組不可行

# =====================================================================
# CHANGELOG(門檻/參數改動留紀錄,append-only)
# =====================================================================
changelog:
  - {date: "2026-08-02", by: "initial", note: "初版:依需求文件寫入門檻與各組參數,未經任何調參。"}
  - {date: "2026-08-02", by: "phase1-supplement",
     note: "新增 entry.monthly_revenue(4參數)與 exit_monthly:月營收版右側訊號,
            驗證『季報落後2-3個月是否為主因』。既有季報版參數一字未動,兩組獨立不共用。
            月營收版運價方向確認主用 BDI(全期覆蓋),另附貨櫃指數版本對照。"}
