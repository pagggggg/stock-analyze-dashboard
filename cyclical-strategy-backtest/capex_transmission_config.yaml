# CAPEX-to-revenue transmission study preregistration.
# This file contains fixed research inputs only. It contains no company guidance data.
schema_version: 1

preregistration:
  study_id: capex_transmission_20260807
  registered_on: "2026-08-07"
  title: Cloud CAPEX to semiconductor supply-chain revenue transmission
  scope: independent_research_not_trading_strategy
  locked: true
  guidance_data: prohibited
  no_imputation: true

vintage_policy:
  basis: historical_actual_research_not_point_in_time_trading
  selection_order:
    - earliest_effective_filing_availability
    - configured_source_priority
    - configured_tag_priority
    - reported_quarter_over_derived_tie_breaker
  later_comparative_disclosures: allowed_only_when_no_earlier_standalone_quarter_candidate_exists
  filing_date_policy: expose_selected_and_component_filing_dates

periods:
  fetch_start: 2013Q1
  output_start: 2014Q1
  full:
    start: 2014Q1
    end: analysis_endpoint
  early:
    start: 2014Q1
    end: 2019Q4
  late:
    start: 2020Q1
    end: analysis_endpoint
  analysis_endpoint:
    rule: latest_completed_calendar_quarter_capped_by_last_quarter_with_all_four_capex_totals
  latest_completed_quarter_rule: quarter_must_have_ended_before_runtime_date

fixed_fx:
  period: 2014Q1
  policy: fixed_for_every_quarter
  twd_per_usd:
    value: 30.2796721311
    fred_series: DEXTAUS
    definition: Taiwan dollars per U.S. dollar
    aggregation: mean_of_nonmissing_daily_observations
    observations: 61
    source_url: https://fred.stlouisfed.org/series/DEXTAUS
  usd_per_eur:
    value: 1.3705049180
    fred_series: DEXUSEU
    definition: U.S. dollars per euro
    aggregation: mean_of_nonmissing_daily_observations
    observations: 61
    source_url: https://fred.stlouisfed.org/series/DEXUSEU

capex:
  currency: USD
  frozen_companies: [MSFT, GOOGL, AMZN, META]
  definition:
    default_total: MSFT and GOOGL PPE cash CAPEX
    amazon_total: Amazon gross productive-assets cash purchases, including PP&E, internal-use software, and other intangibles
    meta_total: PPE cash CAPEX plus financing-lease principal, only when both components exist
    missing_meta_lease: missing, never zero
    standalone_quarters: reported quarter or mechanically derived from adjacent YTD/FY facts
    sign_policy: absolute cash-outflow magnitude
  companies:
    MSFT:
      name: Microsoft
      ppe_sources:
        - cik: "0000789019"
          entity: Microsoft Corporation
          taxonomy: us-gaap
          unit: USD
          priority: 0
          tags:
            - PaymentsToAcquirePropertyPlantAndEquipment
            - CapitalExpenditures
          source_url: https://data.sec.gov/api/xbrl/companyfacts/CIK0000789019.json
      calendar_note: Fiscal quarters are assigned to calendar quarters by the midpoint of the reported period.
    GOOGL:
