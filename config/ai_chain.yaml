# AI 產業鏈全景圖設定。順序就是頁面由資金源頭往上游的顯示順序。
# market: twse=上市 / tpex=上櫃 / us=美股
# 本檔只定義研究分類，不代表公司營收全部來自 AI，也不代表股價必然連動。

cloud_capex:
  tickers: [MSFT, GOOGL, AMZN, META]
  # 法說口頭指引無法可靠自動解析。每筆 entry 必須明列:
  # amount.kind/value(或 low/high；未揭露數字用 undisclosed)、period.basis/label、
  # direction、source、source_date。跨公司比較只採 period.basis=calendar_year。
  guidance:
    MSFT:
      entries:
        - amount: {kind: approximate, value: 175.0, unit: "USD bn"}
          period: {basis: calendar_year, label: "日曆年 2026"}
          direction: unchanged
          source: "Microsoft FY27 Q1 Outlook 簡報；2026-07-29 法說會"
          source_date: "2026-07-29"
          key_point: "維持原指引；數字含租賃分類變更影響"
          note: "約 1,750 億美元；含使用年限變更對租賃分類的影響。"
        - amount: {kind: minimum, value: 50.0, unit: "USD bn"}
          period: {basis: quarter, label: "FY27 Q1（2026年7–9月）"}
          direction: unchanged
          source: "Microsoft FY27 Q1 Outlook 簡報；2026-07-29 法說會"
          source_date: "2026-07-29"
          note: "超過 500 億美元；Microsoft 會計年度單季，不可直接和其他公司的日曆年數字比較。含使用年限變更對租賃分類的影響。"
        - amount: {kind: undisclosed, text: "預期年增，未揭露具體金額", unit: "USD bn"}
          period: {basis: fiscal_year, label: "FY27 全年"}
          direction: yoy_increase
          source: "Microsoft FY27 Q1 Outlook 簡報；2026-07-29 法說會"
          source_date: "2026-07-29"
          note: "僅有方向、無金額；Microsoft 會計年度，不可直接跨公司比較。含使用年限變更對租賃分類的影響。"
    GOOGL:
      entries:
        - amount: {kind: range, low: 195.0, high: 205.0, unit: "USD bn"}
          period: {basis: calendar_year, label: "日曆年 2026"}
          direction: up
          source: "Alphabet Q2 2026 法說會；CFO Anat Ashkenazi"
          source_date: "2026-07"
          key_point: "前次 180–190；加速產能交付"
          note: "上調自前次 180–190 USD bn；原因為加速產能交付以滿足需求成長。Q2 單季 Capex 44.9 USD bn、自由現金流 -5.9 USD bn、Cloud backlog 514.0 USD bn。"
        - amount: {kind: undisclosed, text: "預期顯著增加，未揭露具體金額", unit: "USD bn"}
          period: {basis: calendar_year, label: "日曆年 2027"}
          direction: yoy_increase
          source: "Alphabet Q2 2026 法說會；CFO Anat Ashkenazi"
          source_date: "2026-07"
          note: "只有方向、沒有具體金額；因此不能和其他公司的日曆年金額做數值比較。"
    AMZN:
      entries:
        - amount: {kind: undisclosed, text: "未提供明確 Capex 指引", unit: "USD bn"}
          period: {basis: calendar_year, label: "日曆年 2026"}
          direction: not_stated
          source: "Amazon Q2 2026 財報 Financial Guidance"
          source_date: "2026-07-30"
          key_point: "公司只提供下一季營收與營業利益指引"
          note: "Financial Guidance 僅提供下一季營收與營業利益,不提供 Capex 指引。"
      reported_actuals:
        - metric: net_capex
          amount: {kind: reported, value: 169.0, unit: "USD bn"}
          period: {basis: trailing_12_months, label: "截至 2026 Q2 的近12個月"}
          yoy_pct: 64.0
          source: "Amazon Q2 2026 財報"
          source_date: "2026-07-30"
          note: "公司揭露口徑為資本支出淨額；與 yfinance 的 Capital Expenditure/Purchase of PPE 口徑不完全相同。"
    META:
      entries:
        - amount: {kind: range, low: 130.0, high: 145.0, unit: "USD bn"}
          period: {basis: calendar_year, label: "日曆年 2026"}
          direction: up
          source: "Meta Q2 2026 財報 CFO Outlook"
          source_date: "2026-07-29"
          key_point: "下緣 125→130，上緣維持 145"
          note: "含融資租賃本金。區間收窄,下緣由 125.0 USD bn 上調至 130.0 USD bn,上緣維持 145.0 USD bn,屬實質微幅上調。Q2 單季 Capex 31.08 USD bn；單季自由現金流僅 0.784 USD bn（去年同期 8.55 USD bn）。"

