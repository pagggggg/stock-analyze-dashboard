# ============================================================================
# 每日/每週自動更新 + 部署(GitHub Actions)
# ----------------------------------------------------------------------------
# 為什麼改成雲端排程:原本靠本機 launchd,但那台是 MacBook Pro ——
# 合蓋/睡眠/關機就會錯過排程(實測:排程從未被安裝,網站 4 天沒更新)。
# 雲端 cron 不受你的電腦開關機影響,這是「每天自動更新」唯一可靠的作法。
#
# 三種觸發、做的事不同:
#   schedule(平日 台灣 15:10) 更新台股 + 重算指標 + 記錄訊號 + 部署
#   schedule(週二~六 06:17)  美股盤後更新 16 檔行情 + 4 檔河流圖 + 部署
#   push                         只重建 + 部署；手動可選 none/prices/all
#
# ★ 單一 writer 原則:本 workflow 是 data/main/gh-pages 的唯一寫入者。
#   本機 scripts 只供開發與手動驗證，不得 commit、push 或部署。
#
# 注意:cron 用 UTC。美股排程固定 UTC 22:17，可同時涵蓋夏令/冬令盤後。
# GitHub 的排程在尖峰時可能延遲數分鐘至數十分鐘,這是平台特性,不保證準點。
# ============================================================================
name: daily-update

on:
  schedule:
    - cron: "10 7 * * 1-5"    # 台灣 15:10(週一~週五,交易所收盤檔發布後)
    - cron: "17 22 * * 1-5"   # 台灣 週二~週六 06:17；美股正常收盤後
  push:
    branches: [main]          # 你 push 程式碼時重建部署(資料 commit 帶 [skip ci] 不會觸發)
  workflow_dispatch:
    inputs:
      refresh:
        description: "抓取模式:none=只重建 / prices=更新股價 / all=連財報"
        required: false
        default: "prices"
        type: choice
        options: [none, prices, all]
      scope:
        description: "prices 的更新範圍；all 模式固定更新全部"
        required: false
        default: "all"
        type: choice
        options: [all, tw, us]

permissions:
  contents: write             # 需要寫入:把更新後的 data/ commit 回 main

concurrency:
  group: daily-update
  cancel-in-progress: false   # 排程不互相取消,避免資料寫到一半被中斷

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # 快取 FinMind/TWSE/yfinance 的原始資料:沒有它,每次都要重抓全部財報,
      # 會直接撞爆 FinMind 每小時上限(財報快取 TTL 已設 30 天,所以跨日仍有效)
      # 拆開 restore/save：品質不足的執行不得在 post step 回存 cache，
      # 否則一次 Yahoo/FinMind 暫時失敗會污染後續每次排程。
      - name: Restore data cache
        id: data-cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: apicache-v3-${{ github.run_id }}
          restore-keys: |
            apicache-v3-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test quote pipelines
        run: python -m unittest discover -s tests -p "test_*.py"

      # 快取種子:CI 第一次跑(或快取被 GitHub 清掉)時,cache/ 是空的,
      # build_site 會為 239 檔重抓財報 → 直接撞爆 FinMind 每小時上限 → 大量分析失敗。
      # (實際發生過:產出的網站只剩 28 個詳情頁,原本 222。)
      # 財報與建站用價格/共識快取先從 Release 下載；美股早晨只更新美股，
      # 必須能離線沿用台股快取，不能因 Actions cache 被清掉就重抓 239 檔。
      - name: Seed financial cache (only if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p cache
          shopt -s nullglob
          fs_files=(cache/finmind_fs_long_*.json)
          mr_files=(cache/finmind_mrev_*.json)
          fs=${#fs_files[@]}
          mr=${#mr_files[@]}
          echo "現有快取:財報 $fs 檔、月營收 $mr 檔"
          if [ "$fs" -lt 200 ] || [ "$mr" -lt 200 ]; then
            echo "不足,從 Release 下載種子快取…"
            if gh release download cache-seed -p fincache.tar.gz -O /tmp/fincache.tar.gz \
                 -R "$GITHUB_REPOSITORY" 2>/dev/null; then
              tar -xzf /tmp/fincache.tar.gz -C cache 2>/dev/null
              fs_files=(cache/finmind_fs_long_*.json)
              mr_files=(cache/finmind_mrev_*.json)
              echo "已解壓:財報 ${#fs_files[@]} 檔、月營收 ${#mr_files[@]} 檔"
            else
              echo "::warning::找不到 cache-seed release,本次可能因限流而資料不全(品質檢查會擋下部署)"
            fi
          fi

      # 決定本次要不要抓資料、抓多深
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "refresh=none" >> $GITHUB_OUTPUT
            echo "scope=none" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "refresh=${{ inputs.refresh }}" >> $GITHUB_OUTPUT
            if [ "${{ inputs.refresh }}" = "none" ]; then
              echo "scope=none" >> $GITHUB_OUTPUT
            elif [ "${{ inputs.refresh }}" = "all" ]; then
              echo "scope=all" >> $GITHUB_OUTPUT
            else
              echo "scope=${{ inputs.scope }}" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event.schedule }}" = "17 22 * * 1-5" ]; then
            echo "refresh=prices" >> $GITHUB_OUTPUT
            echo "scope=us" >> $GITHUB_OUTPUT
          else
            echo "refresh=prices" >> $GITHUB_OUTPUT
            echo "scope=tw" >> $GITHUB_OUTPUT
          fi

      - name: Synchronize Taiwan prices
        if: steps.mode.outputs.scope == 'tw'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_tw_prices.py

      - name: Fetch all market data
        if: steps.mode.outputs.scope == 'all'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python fetch_universe.py --from-universe --refresh ${{ steps.mode.outputs.refresh }}

      - name: Synchronize persisted US records
        if: steps.mode.outputs.scope == 'us'
        run: |
          ids=$(python - <<'PY'
          import yaml
          universe = yaml.safe_load(open("config/universe.yaml", encoding="utf-8")) or {}
          print(",".join(sorted(str(x["stock_id"]) for x in universe.get("us") or [])))
          PY
          )
          test -n "$ids"
          python fetch_universe.py --from-universe --stock-ids "$ids" --refresh ${{ steps.mode.outputs.refresh }}

      - name: Update AI US quotes
        if: steps.mode.outputs.scope == 'us' || steps.mode.outputs.scope == 'all'
        run: python update_ai_quotes.py

      - name: Update AI Taiwan quotes
        if: steps.mode.outputs.scope == 'all'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_tw_prices.py

      - name: Screen
        if: steps.mode.outputs.scope != 'none'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python screen.py

      # push 觸發時用 --no-record:那只是程式碼重建,不該產生「今天的訊號」
      - name: Build site
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.scope }}" = "none" ] || [ "${{ steps.mode.outputs.scope }}" = "us" ]; then
            ALLOW_STALE_CACHE=1 python build_site.py --from-universe --no-record --out public
          elif [ "${{ steps.mode.outputs.scope }}" = "tw" ]; then
            ALLOW_STALE_CACHE=1 python build_site.py --from-universe --out public
          else
            python build_site.py --from-universe --out public
          fi

      # 資料完整性檢查:CI 若撞到 FinMind 額度,fetch 會大量缺漏。
      # _save() 已保護「不用殘缺覆蓋完整」,這裡再做一道把關 ——
      # 缺漏太多就不要把資料 commit 回去,避免慢慢劣化 repo 裡的資料。
      - name: Data sanity check
        if: steps.mode.outputs.scope != 'none'
        id: sanity
        run: |
          python - <<'PY'
          import glob, json, math, os, subprocess, yaml
          from src.valuation_flag import pe_history_is_compatible
          doc = yaml.safe_load(open("config/universe.yaml", encoding="utf-8")) or {}
          expected = {str(x["stock_id"]) for k in ("twse", "us") for x in (doc.get(k) or [])}
          actual = set()
          years = (yaml.safe_load(open("config/screener.yaml", encoding="utf-8"))
                   ["valuation_flag"]["pe_history_years"])
          universe_paths = glob.glob("data/universe/*.json")
          tot = ok = partial = pe_schema_ok = pe_current_ok = pe_waiting = pe_source_missing = regressed = 0
          for p in universe_paths:
              d = json.load(open(p)); tot += 1; actual.add(str(d.get("stock_id")))
              if d.get("annual"): ok += 1
              if d.get("partial_update"): partial += 1
              ph = d.get("pe_hist") or {}
              if ph.get("source_cache_regressed"): regressed += 1
              if (not d.get("pe_refresh_error")
                      and pe_history_is_compatible(ph, d.get("market", "twse"),
                                                   d.get("price_date"), years)):
                  pe_schema_ok += 1
                  if ph.get("status") == "ok" and ph.get("current_trailing_pe") is not None:
                      pe_current_ok += 1
                  if ph.get("reason") == "financial_report_not_yet_available":
                      pe_waiting += 1
                  if ph.get("reason") == "financial_eps_source_unavailable":
                      pe_source_missing += 1
          pct = ok / tot * 100 if tot else 0
          same_set = expected == actual
          def committed(path):
              try:
                  return json.loads(subprocess.check_output(
                      ["git", "show", f"HEAD:{path}"], text=True))
              except (subprocess.CalledProcessError, json.JSONDecodeError):
                  return {}
          baseline = [committed(path) for path in universe_paths]
          baseline_partial = sum(bool(d.get("partial_update")) for d in baseline)
          baseline_regressed = sum(bool((d.get("pe_hist") or {}).get("source_cache_regressed"))
                                   for d in baseline)
          protection_ok = partial <= baseline_partial and regressed <= baseline_regressed
          print(f"共 {tot} 檔｜有財報 {ok} ({pct:.1f}%)｜PE schema {pe_schema_ok}/{tot}｜可用 current PE {pe_current_ok}/{tot}｜待補最新 EPS {pe_waiting}｜金融 EPS 來源缺漏 {pe_source_missing}｜cache 保護 {regressed}/{baseline_regressed}｜部分沿用 {partial}/{baseline_partial}｜母體集合一致 {same_set}")
          if not same_set:
              print(f"缺少:{sorted(expected-actual)}｜多餘:{sorted(actual-expected)}")
          pe_floor = max(1, math.ceil(tot * 0.60))
          healthy = (pct >= 90 and same_set and pe_schema_ok == tot
                     and pe_current_ok >= pe_floor and protection_ok)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"healthy={'true' if healthy else 'false'}\n")
              f.write(f"summary={tot} 檔, 財報 {ok}, current PE {pe_current_ok}, 待補 EPS {pe_waiting}, 金融 EPS 來源缺漏 {pe_source_missing}, cache 保護 {regressed}/{baseline_regressed}, 部分沿用 {partial}/{baseline_partial}, 集合一致 {same_set}\n")
          PY

      - name: Warn if data unhealthy
        if: steps.mode.outputs.scope != 'none' && steps.sanity.outputs.healthy != 'true'
        run: |
          echo "::warning::資料完整度不足(${{ steps.sanity.outputs.summary }}),已略過 commit 與部署。"
          echo "多半是撞到 FinMind 每小時上限;快取會保留,下次排程會自動補齊。"

      # ★ 部署前品質把關(對「所有」觸發模式都執行)
      # 踩過的坑:CI 首次執行沒有 API 快取,build_site 要為 239 檔重抓財報,
      # 撞到 FinMind 每小時上限 → 大量個股分析失敗 → 產出的網站只剩 28 個詳情頁,
      # 但 build_site 本身 exit 0,CI 也就「成功」地把劣化的網站部署上線了。
      # 教訓:步驟成功 ≠ 產出可用。這裡直接檢查產物,明顯退步就跳過部署。
      #
      # ★ 為什麼「不合格」不讓 job 失敗:
      #   資料源限流是暫時的、會自己恢復,下次排程通常就正常了。
      #   若每次自我保護都讓 workflow 變成 failure,GitHub 就會寄一封
      #   「All jobs have failed」的信 —— 信裡看不出是「保護生效」還是「真的壞了」,
      #   寄久了只會讓人對通知麻痺,真正出事時反而被忽略。
      #   所以:品質不足 → 記 warning、跳過部署、job 仍算成功(不寄信);
      #         真正的錯誤(抓取/建站崩潰)→ 該步驟自然失敗 → 才寄信。
      - name: Verify built site quality
        id: quality
        env:
          REFRESH_MODE: ${{ steps.mode.outputs.refresh }}
          UPDATE_SCOPE: ${{ steps.mode.outputs.scope }}
          DATA_HEALTHY: ${{ steps.sanity.outputs.healthy }}
        run: |
          python - <<'PY'
          import glob, json, math, os, re, struct, subprocess, yaml, zlib
          from datetime import date
          from src.ai_chain import build_output_side, load_ai_chain_config
          from src.ai_quotes import expected_quote_tickers, load_quote_snapshot
          from src.screener import (P90_THRESHOLD_NOTE, PRICE_LEVEL_WARNING,
                                    p90_threshold_move_text)
          from src.us_data import US_DETAIL_SCHEMA_VERSION
          from src.valuation_flag import pe_history_is_compatible
          from src.tw_quotes import expected_tw_quote_tickers, load_tw_quote_snapshot
          idx = open("public/index.html", encoding="utf-8").read()
          ai_path = "public/ai-chain.html"
          thesis_path = "public/stock_2330.html"
          ux_pages = ["public/index.html", "public/stock_2330.html", "public/stock_7799.html",
                      "public/stock_2890.html", "public/stock_5871.html",
                      "public/stock_9941.html", "public/screener.html"]
          required_us = {"ASML", "AMAT", "LRCX", "KLAC"}
          # 詳情頁數以首頁實際連結為準，而不是只看目錄裡有幾個檔案；
          # 前者才能確認使用者真的能從本次首頁進入個股頁。
          linked = len(set(re.findall(r'href="stock_(\w+)\.html"', idx)))
          ucfg = yaml.safe_load(open("config/universe.yaml", encoding="utf-8")) or {}
          expected_ids = {str(x["stock_id"]) for k in ("twse", "us") for x in (ucfg.get(k) or [])}
          universe_paths = glob.glob("data/universe/*.json")
          n_universe = len(universe_paths)
          # 正常基準是約 225/239 個台股詳情頁；允許少量資料源波動，但不接受大幅退化。
          expected_tw = len(ucfg.get("twse") or [])
          floor = max(1, expected_tw - 20)
          scfg = yaml.safe_load(open("config/screener.yaml", encoding="utf-8")) or {}
          years = scfg["valuation_flag"]["pe_history_years"]
          pe_schema_ok = pe_current_ok = regressed = partial = 0
          actual_ids = set()
          for path in universe_paths:
              d = json.load(open(path, encoding="utf-8"))
              actual_ids.add(str(d.get("stock_id")))
              if d.get("partial_update"): partial += 1
              if (d.get("pe_hist") or {}).get("source_cache_regressed"): regressed += 1
              if (not d.get("pe_refresh_error")
                      and pe_history_is_compatible(d.get("pe_hist") or {}, d.get("market", "twse"),
                                                   d.get("price_date"), years)):
                  pe_schema_ok += 1
                  if ((d.get("pe_hist") or {}).get("status") == "ok"
                          and (d.get("pe_hist") or {}).get("current_trailing_pe") is not None):
                      pe_current_ok += 1
          data_ok = (os.environ["REFRESH_MODE"] == "none"
                     or os.environ.get("DATA_HEALTHY") == "true")
          if data_ok and not actual_ids == expected_ids:
              data_ok = False
          def committed(path):
              try:
                  return json.loads(subprocess.check_output(
                      ["git", "show", f"HEAD:{path}"], text=True))
              except (subprocess.CalledProcessError, json.JSONDecodeError):
                  return {}
          baseline = [committed(path) for path in universe_paths]
          baseline_partial = sum(bool(d.get("partial_update")) for d in baseline)
          baseline_regressed = sum(bool((d.get("pe_hist") or {}).get("source_cache_regressed"))
                                   for d in baseline)
          protection_ok = partial <= baseline_partial and regressed <= baseline_regressed
          pe_current_floor = max(1, math.ceil(n_universe * 0.60))
          ok = (data_ok and actual_ids == expected_ids and linked >= floor
                and pe_schema_ok == n_universe and pe_current_ok >= pe_current_floor
                and protection_ok)
          ux_ok = all(os.path.exists(path) for path in ux_pages)
          price_levels_ok = os.path.exists("public/screener.html")
          if ux_ok:
              negative = open("public/stock_7799.html", encoding="utf-8").read()
              financial = open("public/stock_2890.html", encoding="utf-8").read()
              lenders = [open(path, encoding="utf-8").read()
                         for path in ("public/stock_5871.html", "public/stock_9941.html")]
              detail_2330 = open("public/stock_2330.html", encoding="utf-8").read()
              ux_ok = ("快速摘要" in detail_2330 and 'class="stock-filters"' in idx
                       and 'class="stock-cards"' in idx and "本次新訊號" in idx
                       and "N/M" in negative and "負現金流" in negative
                       and "N/M" in financial and "金融業" in financial
                       and all("N/M" in page and "金融業" in page for page in lenders))
          if price_levels_ok:
              screener = open("public/screener.html", encoding="utf-8").read()
              records = [json.load(open(path, encoding="utf-8")) for path in universe_paths]
              def close_visible(rec):
                  price = (("US$" if rec.get("market") == "us" else "NT$")
                           + f" {float(rec['price_last']):,.2f}")
                  rows = re.findall(
                      rf"<tr><td>{re.escape(str(rec['stock_id']))}</td>.*?</tr>",
                      screener, re.S)
                  return any(price in row and str(rec.get("price_date")) in row for row in rows)
              all_closes_visible = all(
                  close_visible(rec) for rec in records
                  if rec.get("price_last") is not None and rec.get("price_date"))
              sample = next((rec for rec in records
                             if rec.get("market") == "twse"
                             and all((rec.get("pe_hist") or {}).get(k) is not None
                                     for k in ("current_trailing_pe", "median", "p90"))), None)
              if sample:
                  ph = sample["pe_hist"]
                  close = float(sample["price_last"])
                  current_pe = float(ph["current_trailing_pe"])
                  p50_price = close * float(ph["median"]) / current_pe
                  p90_price = close * float(ph["p90"]) / current_pe
                  p50_move = (p50_price / close - 1) * 100
                  p90_move = (p90_price / close - 1) * 100
              else:
                  p50_price = p90_price = p50_move = p90_move = None
              def move_text(value):
                  return f"{'需上漲' if value > 0 else '需回落'} {abs(value):.1f}%"
              sample_p90_state = ("triggered" if current_pe > float(ph["p90"])
                                  else "at_threshold" if math.isclose(
                                      current_pe, float(ph["p90"]), rel_tol=0, abs_tol=1e-9)
                                  else "not_triggered") if sample else "unavailable"
              sample_formula_ok = (sample is not None and
                  all(text in screener for text in (
                      f"NT$ {close:,.2f}", sample["price_date"],
                      f"約 NT$ {p50_price:,.2f}", f"約 NT$ {p90_price:,.2f}",
                      move_text(p50_move),
                      p90_threshold_move_text(p90_move, sample_p90_state))))
              price_levels_ok = (all_closes_visible and sample_formula_ok
                  and all(text in screener for text in (
                      "收盤價", "歷史中樞價", "P50", "P90 警戒門檻價", "P90*",
                      "至 P50", "距 P90 門檻",
                      P90_THRESHOLD_NOTE.replace(">", "&gt;"),
                      "未觸發；需上漲", "才達 P90",
                      "已觸發；需回落", "才解除"))
                  and "解除高估警戒價" not in screener
                  and all(line.replace(">", "&gt;") in screener
                          for line in PRICE_LEVEL_WARNING.splitlines() if line)
                  and screener.count("價格推算警語") == screener.count('class="tbl price-level-table"')
                  and screener.count("N/M") >= 5
                  and "約 US$" in screener)
              detail_snapshot_ok = True
              partial_markers_ok = True
              for rec in records:
                  sid = str(rec["stock_id"])
                  page_path = f"public/stock_{sid}.html"
                  ph = rec.get("pe_hist") or {}
                  if os.path.exists(page_path) and ph.get("status") == "ok":
                      page = open(page_path, encoding="utf-8").read()
                      detail_snapshot_ok = (detail_snapshot_ok
                          and f'data-pe-current="{float(ph["current_trailing_pe"]):.1f}"' in page
                          and f'data-pe-p50="{float(ph["median"]):.1f}"' in page
                          and f'data-pe-p90="{float(ph["p90"]):.1f}"' in page
                          and (not ph.get("source_cache_regressed")
                               or "估值資料保護中" in page))
                  if rec.get("partial_update"):
                      rows = re.findall(
                          rf"<tr><td>{re.escape(sid)}</td>.*?</tr>", screener, re.S)
                      partial_markers_ok = partial_markers_ok and any("部分沿用" in row for row in rows)
              price_levels_ok = price_levels_ok and detail_snapshot_ok and partial_markers_ok
          ok = ok and price_levels_ok
          us_river_ok = required_us <= expected_ids
          for sid in required_us:
              path = f"data/universe/{sid}.json"
              page_path = f"public/stock_{sid}.html"
              if not os.path.exists(path) or not os.path.exists(page_path):
                  us_river_ok = False
                  continue
              rec = json.load(open(path, encoding="utf-8"))
              river = ((rec.get("detail") or {}).get("river") or {})
              page = open(page_path, encoding="utf-8").read()
              band_lengths = [len(river.get(k) or []) for k in
                              ("dates", "band_low", "band_mid", "band_high")]
              price_lengths = [len(river.get(k) or []) for k in ("price_dates", "price")]
              current_pe = river.get("current_pe")
              stored_pe = (rec.get("pe_hist") or {}).get("current_trailing_pe")
              conversion = (rec.get("pe_hist") or {}).get("currency_conversion") or {}
              detail_pe_ok = ((rec.get("pe_hist") or {}).get("schema_version") == 8
                              and (rec.get("pe_hist") or {}).get("release_time_aware") is True
                              and "first_market_close" in (rec.get("pe_hist") or {}).get("method", ""))
              asml_currency_ok = (sid != "ASML" or (
                  (rec.get("pe_hist") or {}).get("schema_version") == 8
                  and conversion.get("from") == "EUR" and conversion.get("to") == "USD"
                  and conversion.get("as_of") == rec.get("price_date")))
              dates = river.get("dates") or []
              band_rows = zip(*(river.get(k) or [] for k in
                              ("band_low", "band_mid", "band_high")))
              bands_ok = all(all(math.isfinite(float(v)) and float(v) > 0 for v in row)
                             and float(row[0]) <= float(row[1]) <= float(row[2])
                             for row in band_rows)
              prices_ok = all(math.isfinite(float(v)) and float(v) > 0
                              for v in river.get("price") or [])
              split_map = {d: float(v) for d, v in ((rec.get("detail") or {}).get("splits") or [])}
              splits_ok = ((sid != "LRCX" or split_map.get("2024-10-03") == 10.0)
                           and (sid != "KLAC" or split_map.get("2026-06-12") == 10.0))
              fresh = (date.today() - date.fromisoformat(rec["price_date"])).days <= 7
              us_river_ok = (us_river_ok and rec.get("market") == "us"
                              and (rec.get("detail") or {}).get("schema_version") == US_DETAIL_SCHEMA_VERSION
                              and river.get("current_date") == rec.get("price_date")
                              and abs(float(river.get("current_price"))
                                      - float(rec.get("price_last"))) <= 0.0001
                              and len(set(band_lengths)) == 1 and 59 <= band_lengths[0] <= 61
                              and len(set(price_lengths)) == 1 and price_lengths[0] >= 1000
                              and dates == sorted(set(dates))
                              and (river.get("price_dates") or []) == sorted(set(river.get("price_dates") or []))
                              and (river.get("price_dates") or [None])[-1] == rec.get("price_date")
                              and bands_ok and prices_ok and splits_ok and fresh
                             and detail_pe_ok
                             and asml_currency_ok and abs(float(river["pe_mid"])
                                 - float((rec.get("pe_hist") or {})["median"])) <= 0.1
                             and current_pe is not None and stored_pe is not None
                             and abs(float(current_pe) - float(stored_pe)) <= 0.2
                             and f'href="stock_{sid}.html"' in idx
                             and f'href="stock_{sid}.html"' in open(ai_path, encoding="utf-8").read()
                             and "本益比河流圖" in page and "\\u80a1\\u50f9 (US$)" in page
                             and "價格 US$" in page and "法定申報期限 fallback" not in page)
          index_market_ok = ("台股 " in idx and "美股 " in idx
                             and "USD " in idx and "TWD " in idx)
          ok = ok and index_market_ok and ux_ok
          ai_ok = os.path.exists(ai_path)
          quotes_ok = False
          thesis_ok = os.path.exists(thesis_path)
          if thesis_ok:
              thesis = open(thesis_path, encoding="utf-8").read()
              tcfg = yaml.safe_load(open("config/thesis_2330.yaml", encoding="utf-8")) or {}
              as_of = str(tcfg.get("as_of_period") or "")
              thesis_ok = ('data-thesis-conditions="4"' in thesis
                           and 'href="stock_2330.html"' in idx
                           and f'data-thesis-as-of="{as_of}"' in thesis
                           and f'data-thesis-gm-latest="{as_of}"' in thesis
                           and "Thesis 狀態" in thesis
                           and "先進製程近乎獨佔" in thesis
                           and thesis.count('class="thesis-condition"') == 4
                           and 'data-thesis-id="gross_margin_two_quarter_decline" data-thesis-status="gray"' not in thesis
                           and 'data-thesis-id="gross_margin_floor" data-thesis-status="gray"' not in thesis)
          if ai_ok:
              ai = open(ai_path, encoding="utf-8").read()
              cfg = load_ai_chain_config("config/ai_chain.yaml")
              quote_expected = expected_quote_tickers(cfg)
              quote_snapshot = load_quote_snapshot(
                  "data/ai_chain_quotes.json", quote_expected, max_age_days=7)
              tw_quote_expected = expected_tw_quote_tickers(cfg)
              tw_quote_snapshot = load_tw_quote_snapshot(
                  "data/ai_chain_tw_quotes.json", tw_quote_expected, max_age_days=14)
              quote_dates = {q["close_date"] for q in quote_snapshot["quotes"].values()}
              tw_quote_dates = {q["close_date"] for q in tw_quote_snapshot["quotes"].values()}
              tw_close_date = max(tw_quote_dates) if tw_quote_dates else None
              all_quote_expected = quote_expected | tw_quote_expected
              quotes_ok = (len(quote_expected) == 16 and len(tw_quote_expected) == 17
                           and f'data-ai-quote-tickers="{len(all_quote_expected)}"' in ai
                           and f'data-ai-us-quote-tickers="{len(quote_expected)}"' in ai
                           and f'data-ai-tw-quote-tickers="{len(tw_quote_expected)}"' in ai
                           and all(ai.count(f'data-quote-ticker="{ticker}"') >= 1
                                   for ticker in all_quote_expected)
                           and all(ai.count(f'data-quote-ticker="{ticker}"') == 1
                                   for ticker in tw_quote_expected)
                           and ai.count('data-quote-market="twse"') == 15
                           and ai.count('data-quote-market="tpex"') == 2
                           and all(date_value in ai for date_value in quote_dates)
                           and all(date_value in ai for date_value in tw_quote_dates)
                           and "台股與美股行情均為最近交易日收盤價,不是即時報價" in ai
                           and "台股行情更新" in ai and "美股行情更新" in ai)
              persisted_quote_ids = quote_expected & expected_ids
              for sid in persisted_quote_ids:
                  rec = json.load(open(f"data/universe/{sid}.json", encoding="utf-8"))
                  quotes_ok = (quotes_ok
                               and rec.get("price_date")
                               == quote_snapshot["quotes"][sid]["close_date"]
                               and abs(float(rec.get("price_last"))
                                       - float(quote_snapshot["quotes"][sid]["close"])) <= 0.0001)
              tw_records = []
              for path in universe_paths:
                  rec = json.load(open(path, encoding="utf-8"))
                  if rec.get("market") == "twse": tw_records.append(rec)
              tw_price_dates = [rec.get("price_date") for rec in tw_records]
              tw_checked_dates = [rec.get("price_checked_through") or rec.get("price_date")
                                  for rec in tw_records]
              quotes_ok = (quotes_ok and tw_close_date is not None
                           and tw_price_dates and max(tw_price_dates) == tw_close_date
                           and all((date.fromisoformat(tw_close_date)
                                    - date.fromisoformat(value)).days <= 14
                                   for value in tw_checked_dates if value)
                           and all(rec.get("price_date") and rec.get("price_checked_through")
                                   for rec in tw_records)
                           and all(rec.get("price_date") == rec.get("price_checked_through")
                                   or rec.get("price_stale_reason") == "no_official_trade"
                                   for rec in tw_records))
              for sid in tw_quote_expected:
                  record_path = f"data/universe/{sid}.json"
                  if os.path.exists(record_path):
                      rec = json.load(open(record_path, encoding="utf-8"))
                      quotes_ok = (quotes_ok and rec.get("price_date")
                                   == tw_quote_snapshot["quotes"][sid]["close_date"]
                                   and abs(float(rec.get("price_last"))
                                           - float(tw_quote_snapshot["quotes"][sid]["close"])) <= 0.0001)
              output = build_output_side(cfg)
              counts = output["counts"]
              expected_layers = len(cfg.get("layers") or [])
              expected_outputs = len((cfg.get("output_side") or {}).get("metrics") or [])
              logo_files = [x.get("file") for x in (cfg.get("logos") or {}).values()]
              def valid_png(path):
                  try:
                      raw = open("public/" + path, "rb").read()
                      if raw[:8] != b'\x89PNG\r\n\x1a\n': return False
                      off, dims, idat, ended = 8, None, [], False
                      while off + 12 <= len(raw):
                          n = struct.unpack(">I", raw[off:off+4])[0]
                          typ = raw[off+4:off+8]; end = off + 12 + n
                          if end > len(raw): return False
                          data = raw[off+8:off+8+n]
                          crc = struct.unpack(">I", raw[off+8+n:end])[0]
                          if (zlib.crc32(typ + data) & 0xffffffff) != crc: return False
                          if typ == b'IHDR': dims = struct.unpack(">II", data[:8])
                          if typ == b'IDAT': idat.append(data)
                          if typ == b'IEND': ended = True; break
                          off = end
                      if not ended or not dims or not all(x > 0 for x in dims): return False
                      zlib.decompress(b''.join(idat))
                      return True
                  except Exception:
                      return False
              logos_ok = bool(logo_files) and all(valid_png(path) for path in logo_files)
              count_attrs_ok = (sum(counts.values()) == expected_outputs
                                and all(f'data-output-{key.replace("_", "-")}="{value}"' in ai
                                        for key, value in counts.items()))
              card_counts_ok = all(
                  ai.count(f'data-output-direction="{key}"') == value
                  for key, value in counts.items())
              ai_ok = (quotes_ok and ai.count('class="chain-layer"') == expected_layers
                        and "四大雲端業者季度 Capex" in ai
                        and 'data-ai-capex-companies="4"' in ai
                        and 'data-ai-unavailable="0"' in ai
                        and ai.count('class="output-card"') == expected_outputs
                        and f'data-output-metrics="{expected_outputs}"' in ai
                        and count_attrs_ok and card_counts_ok
                        and "Microsoft 365 Copilot 付費席次" in ai
                        and "Agentforce ARR" in ai
                        and "ServiceNow AI ACV" in ai
                        and "FY27Q1（截至 2026-04-30）" in ai
                        and logos_ok)
          print(f"母體 {n_universe}/{len(expected_ids)} 檔;首頁實際連得到 {linked} 檔;最低要求 {floor} 檔")
          print(f"資料健康閘門:{data_ok};母體集合一致:{actual_ids == expected_ids}")
          print(f"PE schema/date 完整:{pe_schema_ok}/{n_universe}")
          print(f"可用 current PE:{pe_current_ok}/{n_universe}（最低 {pe_current_floor}；其餘誠實顯示 N/M）")
          print(f"cache 保護:{regressed}/{baseline_regressed};部分沿用:{partial}/{baseline_partial};未增加:{protection_ok}")
          print(f"AI 產業鏈頁完整:{ai_ok}")
          print(f"2330 Thesis 完整:{thesis_ok}")
          print(f"美股河流圖完整:{us_river_ok}")
          print(f"第一階段 UX 完整:{ux_ok}")
          print(f"P50/P90 價格欄完整:{price_levels_ok}")
          print(f"AI 台美股行情完整:{quotes_ok}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok and ai_ok and thesis_ok and us_river_ok else 'false'}\n")
              f.write(f"linked={linked}\nfloor={floor}\n")
          print("品質檢查通過。" if ok and ai_ok and thesis_ok and us_river_ok else "品質不足,將跳過部署。")
          PY

      - name: Skip deploy (quality gate)
        if: steps.quality.outputs.ok != 'true'
        run: |
          echo "::warning title=已跳過部署(保護機制)::首頁或 AI 產業鏈頁未通過品質檢查。首頁可連 ${{ steps.quality.outputs.linked }} 檔,門檻 ${{ steps.quality.outputs.floor }} 檔。線上網站維持前一版不變。"
          echo "這不是故障,是保護機制:寧可不更新,也不要用殘缺版本覆蓋線上好版本。"

      - name: Commit updated data
        if: steps.mode.outputs.scope != 'none' && steps.sanity.outputs.healthy == 'true' && steps.quality.outputs.ok == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "資料無變動,略過 commit"
          else
            git commit -m "chore(data): 自動更新 $(date -u '+%F %H:%M')Z [skip ci]"
            git push origin HEAD:main
          fi

      # 先確保新共識/訊號狀態已安全寫回 main，再發布對應頁面。
      # 若資料 push 失敗，本步不會執行，避免線上站點領先持久化狀態。
      - name: Deploy to gh-pages
        if: steps.quality.outputs.ok == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "main 在建站期間已變更，略過舊產物部署" >&2
            exit 1
          }
          cd public
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # 種子自動更新:把這次(已通過品質檢查)的財報/月營收快取回存到 Release,
      # 讓下一次「快取被 GitHub 清掉」的執行仍能拿到新鮮的種子。
      # 只在整個流程都成功後才更新 —— 否則會把限流當下殘缺的快取存成種子,
      # 之後每次執行都從壞種子開始,越用越糟。
      - name: Refresh cache seed
        if: (steps.mode.outputs.scope == 'tw' || steps.mode.outputs.scope == 'all') && steps.sanity.outputs.healthy == 'true' && steps.quality.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cache
          shopt -s nullglob
          fs_files=(finmind_fs_long_*.json)
          mr_files=(finmind_mrev_*.json)
          fs=${#fs_files[@]}
          mr=${#mr_files[@]}
          if [ "$fs" -lt 200 ] || [ "$mr" -lt 200 ]; then
            echo "::warning::財報/月營收快取不足(fs=$fs,mr=$mr),不更新種子"
            exit 0
          fi
          seed_files=(finmind_fs_long_*.json finmind_bs_*.json finmind_cf_*.json
                      finmind_mrev_*.json finmind_price_*.json finmind_pxv_*.json
                      yf_metrics_*.json twse_market_close_*.json tpex_market_close_*.json
                      tw-income-refresh-state.json
                      ai_chain_tpex_record_v2_*.json
                      ai_chain_us_record_v2_*.json ai_chain_us_quarterly_v2_*.json)
          n=${#seed_files[@]}
          if [ "$n" -lt 800 ]; then
            echo "::warning::快取僅 $n 檔(<800),不更新種子,避免把殘缺快取存成種子"
            exit 0
          fi
          printf '%s\n' "${seed_files[@]}" > /tmp/seed.txt
          python - <<'PY'
          import tarfile
          from pathlib import Path
          names = [line.strip() for line in Path("/tmp/seed.txt").read_text().splitlines()
                   if line.strip()]
          with tarfile.open("/tmp/fincache.tar.gz", "w:gz") as archive:
              for name in names:
                  archive.add(name, arcname=name, recursive=False)
          PY
          cd ..
          gh release upload cache-seed /tmp/fincache.tar.gz --clobber -R "$GITHUB_REPOSITORY"
          echo "種子已更新:$n 檔,$(du -h /tmp/fincache.tar.gz | cut -f1)"

      # 只有通過產物品質檢查的 cache 才能成為下一次排程的起點。
      - name: Save verified data cache
        if: steps.quality.outputs.ok == 'true' && success()
        uses: actions/cache/save@v6
        with:
          path: cache
          key: ${{ steps.data-cache.outputs.cache-primary-key }}
