cyclical_definition:
  lookback_years: 10
  need_hits: 2
  gross_margin_std_pp: 5
  eps_yoy_drop_pct: 50
  revenue_yoy_range_pp: 60
  min_quarters: 8

transmission:
  max_lag_quarters: 6
  min_pairs: 8
  significance_p: 0.05

# 產出側:追蹤企業實際為 AI 付費/簽約的選擇性揭露。
# observation.status: disclosed / not_disclosed；沒有 observation = 尚未輸入/待確認，
# 不可把「尚未輸入」冒充成「公司未揭露」。每一筆 observation 必須含期間、來源與揭露日期。
output_side:
  as_of_period: "2026Q2"
  flat_threshold_pct: 3
  scale_warning: "PLTR 全年美國商用營收約 3.4bn；相對四大 Capex 約 500bn 不到 1%。兩者期間與口徑不同,只作規模警語。"
  scale_warning_source: "使用者提供的規模警語；未指定原始來源與同一比較期間"
  metrics:
    - id: pltr_us_commercial_revenue_yoy
      company: PLTR
      company_name: Palantir
      name: "美國商用營收 YoY"
      value_type: growth_rate
      period_basis: calendar_quarter
      unit: "%"
      observations:
        - {period: "2025Q4", status: disclosed, value: 137.0,
           source: "Palantir Q2 2026 財報", disclosure_date: "2026-08-03"}
        - {period: "2026Q1", status: disclosed, value: 133.0,
           source: "Palantir Q2 2026 財報", disclosure_date: "2026-08-03"}
        - {period: "2026Q2", status: disclosed, value: 149.0,
           source: "Palantir Q2 2026 財報", disclosure_date: "2026-08-03"}
      note: "需逐季人工填入；不是整體 AI 產出的產業代理。"
    - id: msft_copilot_paid_seats
      company: MSFT
      company_name: Microsoft
      name: "Copilot 付費席次"
      value_type: level
      period_basis: calendar_quarter
      unit: "million seats"
      observations:
        - {period: "2026Q2", status: disclosed, kind: minimum, value: 30.0, display: "超過 3,000 萬席",
           source: "Microsoft FY26 Q4 財報新聞稿；Nadella 發言", disclosure_date: "2026-07",
           change_text: "超過 3,000 萬付費席；另揭露 Azure 年營收首次突破 1,000 億美元"}
      note: "席次是使用量指標,不等同營收。"
    - id: msft_azure_ai_growth
      company: MSFT
      company_name: Microsoft
      name: "Azure AI 相關營收成長"
      value_type: growth_rate
      period_basis: calendar_quarter
      unit: "%"
      observations: []
      note: "需明確保存公司揭露口徑(例如 constant currency)。"
    - id: googl_cloud_backlog
      company: GOOGL
      company_name: Alphabet
      name: "Google Cloud backlog（RPO）"
      value_type: level
      period_basis: calendar_quarter
      unit: "USD bn"
      observations:
        - {period: "2026Q2", status: disclosed, value: 514.0,
           source: "Alphabet Q2 2026 法說會；CFO 發言", disclosure_date: "2026-07",
           change_text: "單季增加超過 50 USD bn；超過 50% 預期於未來 24 個月認列"}
      note: "Cloud 整體 backlog/RPO,不是純 AI backlog。"
    - id: amzn_aws_ai_run_rate
      company: AMZN
      company_name: Amazon
      name: "AWS AI 業務年化營收 run rate"
      value_type: level
      period_basis: calendar_quarter
      unit: "USD bn"
      observations:
        - {period: "2026Q2", status: disclosed, kind: minimum, value: 25.0,
           source: "Amazon Q2 2026 財報新聞稿", disclosure_date: "2026-07-30",
           change_text: "三位數成長；另揭露晶片業務年化營收亦超過 25 USD bn"}
      note: "公司選擇性揭露的 run rate,不等同 GAAP 營收。"
    - id: crm_ai_revenue
      company: CRM
      company_name: Salesforce
      name: "AI 產品營收"
      value_type: level
      period_basis: calendar_quarter
      unit: "USD bn"
      observations: []
      note: "需確認指標是否為純 AI 產品,不可拿整體訂單冒充。"
    - id: now_ai_revenue
      company: NOW
      company_name: ServiceNow
      name: "AI 產品營收"
      value_type: level
      period_basis: calendar_quarter
      unit: "USD bn"
      observations: []
      note: "需確認指標是否為純 AI 產品,不可拿整體訂單冒充。"

