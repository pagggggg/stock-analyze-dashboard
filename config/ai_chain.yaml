# AI 產業鏈全景圖設定。順序就是頁面由資金源頭往上游的顯示順序。
# market: twse=上市 / tpex=上櫃 / us=美股
# 本檔只定義研究分類，不代表公司營收全部來自 AI，也不代表股價必然連動。

cloud_capex:
  tickers: [MSFT, GOOGL, AMZN, META]
  # 法說口頭指引無法可靠自動解析；需要時人工填入，空值會如實顯示「未填」。
  guidance:
    MSFT: {value: null, unit: "USD bn", source: "", note: "請填最新法說口頭 Capex 指引"}
    GOOGL: {value: null, unit: "USD bn", source: "", note: "請填最新法說口頭 Capex 指引"}
    AMZN: {value: null, unit: "USD bn", source: "", note: "請填最新法說口頭 Capex 指引"}
    META: {value: null, unit: "USD bn", source: "", note: "請填最新法說口頭 Capex 指引"}

cyclical_definition:
  lookback_years: 10
  need_hits: 2
  gross_margin_std_pp: 5
  eps_yoy_drop_pct: 50
  revenue_yoy_range_pp: 60
  min_quarters: 8

transmission:
  max_lag_quarters: 6
  min_pairs: 8
  significance_p: 0.05

